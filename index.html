<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一次関数ビジュアライザー</title>
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="一次関数" />

<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#d1d5db;
    --axis:#111827;
    --accent:#2563eb;
    --point:#dc2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:24px;
  }
  h1{
    margin:0 0 8px;
    font-size:clamp(26px,4vw,42px);
  }
  .lead{
    margin:0 0 20px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    padding:20px;
  }
  .equation{
    font-size:34px;
    font-weight:800;
    text-align:center;
    margin:8px 0 22px;
    letter-spacing:.02em;
  }
  .control{
    margin:18px 0;
  }
  .control label{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-weight:700;
    margin-bottom:8px;
  }
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  .hint{
    font-size:14px;
    color:var(--muted);
    line-height:1.7;
    background:#f9fafb;
    border-radius:12px;
    padding:12px 14px;
    margin-top:14px;
  }
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
  }
  .stat{
    background:#f9fafb;
    border-radius:12px;
    padding:12px;
  }
  .stat small{color:var(--muted)}
  .stat strong{display:block;font-size:21px;margin-top:4px}
  button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:12px 16px;
    margin-top:14px;
    background:#111827;
    color:white;
    font-weight:700;
    cursor:pointer;
  }
  .graphCard{padding:14px}
  svg{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:1/1;
    border-radius:14px;
    background:white;
  }
  .caption{
    margin:10px 6px 2px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top:8px;
    font-size:14px;
  }
  .legend span::before{
    content:"";
    display:inline-block;
    width:14px;height:4px;border-radius:999px;
    margin-right:7px;vertical-align:middle;
    background:currentColor;
  }
  .legend .lineL{color:var(--accent)}
  .legend .pointL{color:var(--point)}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>一次関数ビジュアライザー</h1>
  <p class="lead">スライダーを動かして、傾きと切片がグラフにどう影響するか見てみよう。</p>

  <div class="grid">
    <section class="card">
      <div class="equation" id="equation">y = x</div>

      <div class="control">
        <label>
          <span>傾き a</span>
          <span id="aValue">1.0</span>
        </label>
        <input id="a" type="range" min="-5" max="5" step="0.1" value="1" />
      </div>

      <div class="control">
        <label>
          <span>切片 b</span>
          <span id="bValue">0.0</span>
        </label>
        <input id="b" type="range" min="-5" max="5" step="0.1" value="0" />
      </div>

      <div class="stats">
        <div class="stat">
          <small>グラフの向き</small>
          <strong id="direction">右上がり</strong>
        </div>
        <div class="stat">
          <small>y切片</small>
          <strong id="intercept">(0, 0)</strong>
        </div>
      </div>

      <div class="hint" id="hint">
        a が正なので、x が増えると y も増えます。
      </div>

      <button id="reset">a = 1, b = 0 に戻す</button>
    </section>

    <section class="card graphCard">
      <svg id="graph" viewBox="0 0 600 600" role="img" aria-label="一次関数のグラフ"></svg>
      <div class="legend">
        <span class="lineL">一次関数 y = ax + b</span>
        <span class="pointL">y切片</span>
      </div>
      <p class="caption">
        横軸が x、縦軸が y です。赤い点は y 切片 <strong>(0, b)</strong> を表します。
      </p>
    </section>
  </div>
</div>

<script>
const svg = document.getElementById("graph");
const aInput = document.getElementById("a");
const bInput = document.getElementById("b");
const aValue = document.getElementById("aValue");
const bValue = document.getElementById("bValue");
const equation = document.getElementById("equation");
const direction = document.getElementById("direction");
const intercept = document.getElementById("intercept");
const hint = document.getElementById("hint");
const resetBtn = document.getElementById("reset");

const W = 600, H = 600;
const xmin = -10, xmax = 10, ymin = -10, ymax = 10;

function sx(x){ return (x - xmin) / (xmax - xmin) * W; }
function sy(y){ return H - (y - ymin) / (ymax - ymin) * H; }

function fmt(n){
  if (Math.abs(n) < 1e-9) return "0";
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return n.toFixed(1);
}

function equationText(a,b){
  if (Math.abs(a) < 1e-9) return `y = ${fmt(b)}`;
  let aPart = "";
  if (Math.abs(a - 1) < 1e-9) aPart = "x";
  else if (Math.abs(a + 1) < 1e-9) aPart = "-x";
  else aPart = `${fmt(a)}x`;

  if (Math.abs(b) < 1e-9) return `y = ${aPart}`;
  return `y = ${aPart} ${b > 0 ? "+" : "−"} ${fmt(Math.abs(b))}`;
}

function el(name, attrs = {}){
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

function drawGrid(){
  for(let i = -10; i <= 10; i++){
    const v = i;

    const vline = el("line",{
      x1:sx(v), y1:0, x2:sx(v), y2:H,
      stroke: v===0 ? "#111827" : "#e5e7eb",
      "stroke-width": v===0 ? 2.4 : 1
    });
    svg.appendChild(vline);

    const hline = el("line",{
      x1:0, y1:sy(v), x2:W, y2:sy(v),
      stroke: v===0 ? "#111827" : "#e5e7eb",
      "stroke-width": v===0 ? 2.4 : 1
    });
    svg.appendChild(hline);

    if(i !== 0 && i % 2 === 0){
      const xt = el("text",{
        x:sx(i), y:sy(0)+20,
        "text-anchor":"middle",
        "font-size":"14",
        fill:"#6b7280"
      });
      xt.textContent = i;
      svg.appendChild(xt);

      const yt = el("text",{
        x:sx(0)-10, y:sy(i)+5,
        "text-anchor":"end",
        "font-size":"14",
        fill:"#6b7280"
      });
      yt.textContent = i;
      svg.appendChild(yt);
    }
  }

  const xLabel = el("text",{x:W-12,y:sy(0)-10,"text-anchor":"end","font-size":"18","font-weight":"700",fill:"#111827"});
  xLabel.textContent = "x";
  svg.appendChild(xLabel);

  const yLabel = el("text",{x:sx(0)+12,y:22,"font-size":"18","font-weight":"700",fill:"#111827"});
  yLabel.textContent = "y";
  svg.appendChild(yLabel);
}

function clipSegment(a,b){
  const pts = [];
  const candidates = [
    {x:xmin, y:a*xmin+b},
    {x:xmax, y:a*xmax+b}
  ];
  if (Math.abs(a) > 1e-9){
    candidates.push({x:(ymin-b)/a, y:ymin});
    candidates.push({x:(ymax-b)/a, y:ymax});
  } else {
    candidates.push({x:xmin,y:b},{x:xmax,y:b});
  }

  for(const p of candidates){
    if(p.x >= xmin-1e-9 && p.x <= xmax+1e-9 && p.y >= ymin-1e-9 && p.y <= ymax+1e-9){
      if(!pts.some(q => Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)){
        pts.push(p);
      }
    }
  }
  return pts.slice(0,2);
}

function update(){
  const a = Number(aInput.value);
  const b = Number(bInput.value);

  aValue.textContent = a.toFixed(1);
  bValue.textContent = b.toFixed(1);
  equation.textContent = equationText(a,b);
  intercept.textContent = `(0, ${fmt(b)})`;

  if(a > 0){
    direction.textContent = "右上がり";
    hint.textContent = "a が正なので、x が増えると y も増えます。a の絶対値が大きいほど、傾きは急になります。";
  }else if(a < 0){
    direction.textContent = "右下がり";
    hint.textContent = "a が負なので、x が増えると y は減ります。|a| が大きいほど、傾きは急になります。";
  }else{
    direction.textContent = "水平";
    hint.textContent = "a = 0 なので、x が変わっても y は一定です。これは y = b という水平な直線です。";
  }

  svg.innerHTML = "";
  drawGrid();

  const pts = clipSegment(a,b);
  if(pts.length === 2){
    const line = el("line",{
      x1:sx(pts[0].x), y1:sy(pts[0].y),
      x2:sx(pts[1].x), y2:sy(pts[1].y),
      stroke:"#2563eb",
      "stroke-width":"5",
      "stroke-linecap":"round"
    });
    svg.appendChild(line);
  }

  if(b >= ymin && b <= ymax){
    const point = el("circle",{
      cx:sx(0), cy:sy(b), r:7,
      fill:"#dc2626",
      stroke:"#ffffff",
      "stroke-width":"3"
    });
    svg.appendChild(point);

    const label = el("text",{
      x:sx(0)+12, y:sy(b)-12,
      "font-size":"15",
      "font-weight":"700",
      fill:"#dc2626"
    });
    label.textContent = `(0, ${fmt(b)})`;
    svg.appendChild(label);
  }
}

aInput.addEventListener("input", update);
bInput.addEventListener("input", update);
resetBtn.addEventListener("click", () => {
  aInput.value = 1;
  bInput.value = 0;
  update();
});

update();
</script>
</body>
</html>
